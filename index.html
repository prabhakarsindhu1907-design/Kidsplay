<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>சுழற்று, விளையாடு! – Kids Play Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFE58A;--bg2:#FFD23F;--card:#FFFFFF;--ink:#23305E;--soft:#5B6690;--muted:#EEF0F8;
  --good:#2BB24C;--bad:#F25C54;--shadow:#23305E;--tabbg:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1E2547;--bg2:#151A36;--card:#2B3463;--ink:#FFF4D6;--soft:#B9C1E8;--muted:#232B55;--shadow:#0B0F24;--tabbg:#252D58;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1E2547;--bg2:#151A36;--card:#2B3463;--ink:#FFF4D6;--soft:#B9C1E8;--muted:#232B55;--shadow:#0B0F24;--tabbg:#252D58;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{font-family:"Baloo Thambi 2","Nirmala UI","Latha",system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 15% 0%,var(--bg) 0,var(--bg) 45%,var(--bg2) 100%);background-attachment:fixed;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid #1FB5A8;outline-offset:3px}
.hidden{display:none!important}
.app{max-width:640px;margin:0 auto;padding:14px 14px calc(100px + env(safe-area-inset-bottom,0px))}
.app.nogap{padding-bottom:28px}
.chunk{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--shadow)}
.btn{border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--shadow);font-weight:800;font-size:1.2rem;padding:10px 20px;background:var(--card);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.55}
.wide{display:block;width:100%}
.primary{background:#FF6B6B;color:#fff}
h1{font-size:2.2rem;line-height:1.05;margin:4px 0;font-weight:800}
h2{font-size:1.5rem;margin:0;line-height:1.15;font-weight:800}
h3{font-size:1.2rem;margin:20px 0 10px;font-weight:800}
h3 small{font-weight:600;color:var(--soft);font-size:.9rem}
p{margin:0}
.soft{color:var(--soft)}
.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.back{width:50px;height:50px;padding:0;border-radius:50%;font-size:1.5rem;flex:none}

/* home */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello .soft{font-size:1.1rem}
.pstrip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px}
.pmini{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:40px;border:3px solid var(--pc);background:var(--card);font-weight:800}
.pmini .a{width:40px;height:40px;border-radius:50%;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.pmini small{display:block;font-weight:600;color:var(--soft);font-size:.8rem;line-height:1}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.gcard{text-align:left;padding:12px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--gc) 20%,var(--card));border-radius:24px}
.gcard .ge{width:64px;height:64px;border-radius:20px;background:var(--gc);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:2.2rem;transform:rotate(-4deg)}
.gcard:nth-child(even) .ge{transform:rotate(4deg)}
.gcard b{font-size:1.2rem;line-height:1.1}
.gcard .en{font-size:.9rem;color:var(--soft);font-weight:600;line-height:1}
.gcard .meta{font-size:.85rem;font-weight:700;color:var(--soft)}
.daily{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:6px}
.daily .de{font-size:2.4rem}

/* setup */
.hero{display:flex;gap:14px;align-items:center;padding:14px;background:color-mix(in srgb,var(--gc) 22%,var(--card))}
.hero .he{font-size:3rem;width:78px;height:78px;flex:none;border-radius:22px;background:var(--gc);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.hero p{font-size:1.05rem;line-height:1.35}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pchip{position:relative;display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:40px;border:3px solid var(--ink);background:var(--card);font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 var(--shadow);opacity:.6}
.pchip .a{width:42px;height:42px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.pchip.on{opacity:1;background:color-mix(in srgb,var(--pc) 25%,var(--card));border-color:var(--pc)}
.pchip.on .a{background:var(--pc)}
.pchip .n{position:absolute;top:-10px;right:-6px;background:var(--ink);color:var(--card);border-radius:50%;width:24px;height:24px;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.optrow{margin-top:14px}
.optrow label{font-weight:800;display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font-size:1rem;padding:6px 14px;border-radius:14px;box-shadow:0 3px 0 var(--shadow)}
.seg button.on{background:var(--ink);color:var(--card)}
.warn{color:var(--bad);font-weight:700;text-align:center;min-height:1.4em;margin-top:8px}
.go{margin-top:20px;font-size:1.6rem}

/* in-game strip */
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sp{flex:1 1 0;min-width:120px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:16px;border:3px solid var(--pc);background:var(--card);opacity:.6;transition:transform .2s}
.sp.on{opacity:1;transform:scale(1.04);background:color-mix(in srgb,var(--pc) 22%,var(--card));box-shadow:0 4px 0 var(--shadow)}
.sp span{font-size:1.5rem}
.sp b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp em{font-style:normal;font-weight:800;font-size:1.3rem}
.note{text-align:center;font-weight:800;font-size:1.25rem;margin:4px 0 12px;min-height:1.6em}
.card{padding:22px 16px;text-align:center}
.card .big{font-size:4.5rem;line-height:1.1}

/* modal + questions */
.ov{position:fixed;inset:0;background:rgba(20,24,50,.6);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30}
.modal{width:100%;max-width:520px;max-height:100%;overflow:auto;padding:18px 16px 20px;text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.tag{display:inline-block;font-weight:800;padding:2px 14px;border-radius:12px;color:#23305E;font-size:1rem;border:2px solid #23305E}
.q{font-size:1.65rem;font-weight:800;line-height:1.2;margin:10px 0 2px}
.qt{font-size:1.1rem;color:var(--soft);margin:2px 0 10px}
.say{font-size:1rem;padding:4px 12px;margin-bottom:8px;box-shadow:0 3px 0 var(--shadow)}
.vis{font-size:2.4rem;line-height:1.25;margin:6px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;align-items:center}
.vis .plus{font-size:2rem;font-weight:800;color:var(--soft)}
.vis .grp{display:flex;flex-wrap:wrap;gap:2px;max-width:45%;justify-content:center}
.vis .gone{opacity:.3;position:relative}
.vis .gone::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:4px;background:var(--bad);transform:rotate(-30deg);border-radius:2px}
.cnt{display:grid;grid-template-columns:repeat(5,auto);gap:2px 8px}
.bigemo{font-size:4.5rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.opt{min-height:92px;font-size:2.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;line-height:1.1}
.opt small{font-size:.9rem;font-weight:700}
.opt svg{width:70px;height:70px}
.opt.dot{border-radius:50%;aspect-ratio:1;min-height:0;max-width:104px;margin:0 auto;width:100%}
.opt.yes{background:var(--good)!important;color:#fff;animation:boing .5s}
.opt.no{animation:shake .4s;opacity:.35}
@keyframes boing{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{font-size:1.35rem;font-weight:800;min-height:2rem;margin-top:12px}
.big{font-size:4.5rem;margin:4px 0}
.act{background:var(--good);color:#fff;font-size:1.4rem;margin-top:12px}
.next{background:var(--ink);color:var(--card);margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* wheel */
.wheelbox{position:relative;width:min(86vw,390px);aspect-ratio:1;margin:16px auto 16px}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--ink);box-shadow:0 8px 0 var(--shadow);transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--ink);z-index:3}
.hub{position:absolute;inset:38%;border-radius:50%;background:var(--card);border:5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:2.1rem;font-weight:800;z-index:2}
.spin{display:block;width:100%;font-size:1.5rem;color:#fff}

/* memory */
.mgrid{display:grid;gap:8px;padding:8px;border-radius:20px;border:4px dashed var(--pc);max-width:520px;margin:0 auto}
.mcard{aspect-ratio:3/4;padding:0;border:none;background:none;perspective:600px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--shadow)}
.mcard .f{background:repeating-linear-gradient(45deg,#8E7CFF 0 10px,#7a68f0 10px 20px);font-size:1.6rem;color:#fff;font-weight:800}
.mcard .b{background:var(--card);transform:rotateY(180deg);font-size:clamp(1.6rem,8vw,2.6rem)}
.mcard.done .b{background:color-mix(in srgb,var(--good) 30%,var(--card))}
.mcard.done{animation:boing .5s}

/* race */
.race{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.half{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px;background:color-mix(in srgb,var(--pc) 20%,var(--bg));transition:background .2s;min-height:0}
.half.top{transform:rotate(180deg)}
.half.win{background:color-mix(in srgb,var(--good) 45%,var(--bg))}
.half.frozen{filter:grayscale(1) brightness(.8)}
.half.waiting .ropts{opacity:.35}
.rhead{width:100%;max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.2rem}
.rhead b{font-size:1.8rem;background:var(--pc);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:0 12px}
.rprompt{text-align:center;font-size:3.4rem;line-height:1.1;min-height:4rem;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px 6px}
.rprompt svg{width:70px;height:70px}
.rprompt .cd{font-size:3rem;font-weight:800}
.ropts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;width:100%;margin:0 auto}
.ropts .opt{min-height:74px;font-size:2.2rem}
.ropts .opt svg{width:52px;height:52px}
.ropts .opt.dot{max-width:78px}
.rmid{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px;background:var(--ink);color:var(--card);font-weight:800}
.rmid .btn{padding:2px 12px;font-size:1rem;box-shadow:none;border-width:2px;color:var(--ink)}

/* snakes */
.sboard{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;border:4px solid var(--ink);border-radius:18px;background:var(--ink);max-width:520px;margin:0 auto}
.cell{position:relative;aspect-ratio:1;border-radius:10px;background:#FFF7D1;color:#23305E;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:2px;overflow:hidden}
.cell.b{background:#C9F2E6}
.cell.lad{background:#B9E6A0}
.cell.snk{background:#FFC2BD}
.cell.star{background:#FFE14D}
.cell.end{background:#D9CFFF}
.cell i{position:absolute;top:1px;left:4px;font-style:normal;font-weight:800;font-size:.8rem;opacity:.75}
.cell em{position:absolute;top:30%;left:0;right:0;text-align:center;font-style:normal;font-size:clamp(.8rem,3.4vw,1.15rem);font-weight:800;line-height:1}
.tok{width:clamp(20px,6vw,30px);height:clamp(20px,6vw,30px);border-radius:50%;border:2px solid #23305E;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(.8rem,3.6vw,1.15rem);margin:-2px;z-index:2;animation:boing .3s}
.dicebar{display:flex;align-items:center;gap:14px;margin-top:14px}
.die{width:74px;height:74px;flex:none;background:#fff;border:4px solid #23305E;border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:0 5px 0 var(--shadow)}
.die i{border-radius:50%;margin:3px}
.die i.on{background:#23305E}
.die.roll{animation:shake .15s infinite}
.roll{flex:1;color:#fff;font-size:1.35rem}

/* tic tac toe */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.tc{aspect-ratio:1;font-size:clamp(2.4rem,14vw,3.8rem);border:3px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--shadow);padding:0}
.tc.w{background:var(--good)!important;animation:boing .6s}

/* balloon */
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;margin-bottom:8px}
.bhead .t{display:flex;align-items:center;gap:6px}
.barea{position:relative;height:min(62vh,520px);border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:linear-gradient(#9EE3FF,#E0F7FF);touch-action:manipulation}
.balloon{position:absolute;bottom:0;width:66px;height:82px;border:none;padding:0;border-radius:50% 50% 48% 52%/58% 58% 42% 42%;box-shadow:inset -8px -8px 0 rgba(0,0,0,.15),inset 6px 6px 0 rgba(255,255,255,.35);color:#fff;font-size:1.9rem;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:rise linear forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:30px;background:rgba(35,48,94,.5)}
.balloon.pop{animation:popb .25s forwards!important}
.balloon.wrong{filter:grayscale(.8)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(var(--h))}}
@keyframes popb{to{transform:scale(1.8);opacity:0}}
.swatch{display:inline-block;width:28px;height:34px;border-radius:50% 50% 48% 52%/58% 58% 42% 42%;border:2px solid #23305E;vertical-align:middle}

/* simon */
.simon{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(86vw,380px);margin:0 auto}
.pad{aspect-ratio:1;border:4px solid var(--ink);background:var(--c);font-size:3rem;filter:brightness(.6) saturate(.8);transition:filter .1s,transform .1s;padding:0}
.pad:nth-child(1){border-radius:100% 14px 14px 14px}
.pad:nth-child(2){border-radius:14px 100% 14px 14px}
.pad:nth-child(3){border-radius:14px 14px 14px 100%}
.pad:nth-child(4){border-radius:14px 14px 100% 14px}
.pad.lit{filter:brightness(1.15) saturate(1.2);transform:scale(1.05)}
.scenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;background:var(--card);border:4px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem;line-height:1;pointer-events:none}
.scenter small{font-size:.75rem}

/* draw */
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.dtop b{font-size:1.6rem}
.paper{display:block;width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;touch-action:none}
.dtools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center;justify-content:center}
.cbtn{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);padding:0}
.cbtn.on{transform:scale(1.2);box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.tbtn{font-size:1.2rem;padding:4px 10px;box-shadow:0 3px 0 var(--shadow)}
.tbtn.on{background:var(--ink);color:var(--card)}

/* results */
.rank{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;border:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 15%,var(--card));font-weight:800}
.rrow .m{font-size:1.8rem;width:36px;text-align:center}
.rrow .a{font-size:1.8rem}
.rrow .nm{flex:1;font-size:1.2rem}
.rrow .s{font-size:1.2rem}
.rrow .st{font-size:.95rem;color:var(--soft)}
.newb{padding:12px;margin-top:6px;background:color-mix(in srgb,#FFD23F 35%,var(--card))}

/* progress */
.lb{padding:8px 12px}
.lbrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed var(--muted);font-weight:800}
.lbrow:last-child{border-bottom:none}
.lbrow .m{width:30px;font-size:1.4rem;text-align:center}
.lbrow .a{width:40px;height:40px;border-radius:50%;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid var(--ink)}
.lbrow .nm{flex:1}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.ptabs .pchip{flex:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{padding:10px 4px;text-align:center}
.tile b{display:block;font-size:1.6rem;line-height:1.1}
.tile small{font-size:.8rem;color:var(--soft);font-weight:700}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.skills{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sk{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:8px;font-weight:700}
.sk .e{font-size:1.3rem;text-align:center;font-weight:800}
.sk .l small{color:var(--soft);font-weight:600}
.sk .bar{grid-column:2/4;height:14px;border-radius:8px;background:var(--muted);border:2px solid var(--ink);overflow:hidden;margin-top:-4px}
.sk .bar i{display:block;height:100%}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{padding:10px 6px;text-align:center;font-weight:700;font-size:.85rem;line-height:1.2}
.badge .e{font-size:2.2rem;display:block}
.badge.off{opacity:.35;filter:grayscale(1)}
.hist{padding:4px 12px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--muted)}
.hrow:last-child{border-bottom:none}
.hrow .e{font-size:1.6rem}
.hrow .d{flex:1;min-width:0}
.hrow .d b{display:block}
.hrow .d small{color:var(--soft);font-weight:600}
.empty{padding:20px;text-align:center;color:var(--soft);font-weight:700}

/* players */
.plist{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-color:var(--pc)}
.prow .a{width:56px;height:56px;border-radius:50%;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid var(--ink);flex:none}
.prow .d{flex:1;min-width:0}
.prow .d b{font-size:1.3rem;display:block}
.prow .d small{color:var(--soft);font-weight:700}
.prow .btn{padding:6px 12px;font-size:1.2rem;box-shadow:0 3px 0 var(--shadow)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;background:var(--tabbg);border-top:3px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:150px;border:none;background:none;border-radius:16px;padding:4px 2px;font-weight:700;font-size:.82rem;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tabs button span{font-size:1.5rem}

.tabs button.on{background:var(--ink);color:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:8px 18px;border-radius:16px;font-weight:800;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const app=$('#app');
const L=(ta,en)=>S.settings.lang==='en'?en:ta;

const gn=g=>L(g.ta,g.en), gsub=g=>L(g.en,g.ta);

/* ================= state ================= */
const PCOLORS=['#FF6B6B','#1FB5A8','#8E7CFF','#FFB238','#4D9DE0','#F28AC0'];
const AVATARS=['🦁','🐯','🐼','🐵','🦄','🐸','🚀','🦖','🐶','🐱','🦋','🐧','🐻','🦊','👑','⚽','🌻','🐬'];
function defaultState(){return{v:2,players:[
  {id:'p1',name:'நிலநாதவ்',av:'🦁',color:PCOLORS[0]},
  {id:'p2',name:'அப்பா',av:'🐼',color:PCOLORS[1]},
  {id:'p3',name:'அம்மா',av:'🦋',color:PCOLORS[2]}],
  stats:{},history:[],settings:{sound:true,voice:true,diff:'easy',theme:'auto',lastSel:{},lastOpts:{},lang:'ta'},updatedAt:0}}
function normalize(r){const d=defaultState();r.settings=Object.assign(d.settings,r.settings||{});r.stats=r.stats||{};r.history=r.history||[];if(!Array.isArray(r.players)||r.players.length<2)r.players=d.players;return r}
function load(){
  try{const r=JSON.parse(localStorage.getItem('spinplay_v2'));if(r&&r.players)return normalize(r)}catch(e){}
  const d=defaultState();
  try{const o=JSON.parse(localStorage.getItem('sp_setup'));if(o&&o.n){d.players[0].name=o.n[0];d.players[0].av=o.a[0];d.players[1].name=o.n[1];d.players[1].av=o.a[1]}}catch(e){}
  return d;
}
let S=load();
function st(pid){return S.stats[pid]||(S.stats[pid]={stars:0,wins:0,plays:0,games:{},skills:{},days:[]})}
let dbDoc=null,dbTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem('spinplay_v2',JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(dbTimer);dbTimer=setTimeout(()=>{dbDoc.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).catch(()=>{})},800)}
}
function applyTheme(){const r=document.documentElement;r.lang=S.settings.lang==='en'?'en':'ta';if(S.settings.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.settings.theme)}
applyTheme();

/* optional account sync: progress follows the person across devices */
(async()=>{
  try{
    for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/state');
    const snap=await dbDoc.get();
    const d=snap.exists&&snap.data();
    if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){
      S=normalize(JSON.parse(d.json));try{localStorage.setItem('spinplay_v2',JSON.stringify(S))}catch(e){}
      applyTheme();if(currentTab)go(currentTab);
    }else if(S.updatedAt){save()}
  }catch(e){}
})();

/* ================= sound & voice ================= */
let actx=null;
function tone(f,d=.12,type='sine',v=.15,delay=0){
  if(!S.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
  tap:()=>tone(660,.06,'triangle',.1),
  tick:()=>tone(900,.04,'square',.05),
  yes:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.18,i*.09)),
  no:()=>{tone(220,.25,'sawtooth',.07);tone(180,.3,'sawtooth',.07,.12)},
  win:()=>[523,523,784,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.2,i*.15)),
  pop:()=>{tone(880,.05,'square',.08);tone(1320,.08,'triangle',.08,.04)},
  step:i=>tone(392+i*30,.09,'triangle',.14)
};
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t,lang){
  if(!S.settings.voice||!t||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
    if(lang==='ta'){const v=voices.find(v=>/^ta/i.test(v.lang));if(!v)return;u.voice=v;u.lang=v.lang}
    else{u.lang='en-IN';const v=voices.find(v=>v.lang==='en-IN')||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v}
    u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}

/* ================= confetti / toast / modal ================= */
const cc=$('#confetti'),cx=cc.getContext('2d');let parts=[],raf=null;
function csize(){cc.width=innerWidth;cc.height=innerHeight}addEventListener('resize',csize);csize();
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#FF6B6B','#FFD23F','#1FB5A8','#8E7CFF','#4D9DE0','#F28AC0'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,c:pick(cols),r:Math.random()*6,life:120});
  if(!raf)cloop();
}
function cloop(){cx.clearRect(0,0,cc.width,cc.height);parts=parts.filter(p=>p.life-->0);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  raf=parts.length?requestAnimationFrame(cloop):null;if(!raf)cx.clearRect(0,0,cc.width,cc.height)}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
function openModal(html){$('#modal').innerHTML=html;$('#ov').classList.remove('hidden')}
function closeModal(){$('#ov').classList.add('hidden');$('#modal').innerHTML=''}
function askConfirm(title,msg,yes,onYes){
  openModal(`<div class="big">🤔</div><div class="q">${title}</div><p class="qt">${msg}</p><div class="row2"><button class="btn" id="cNo">${L('வேண்டாம்','Cancel')}</button><button class="btn danger" id="cYes">${yes}</button></div>`);
  $('#cNo').onclick=closeModal;$('#cYes').onclick=()=>{closeModal();onYes()};
}

/* ================= content bank ================= */
const SKILL={color:['🎨',['நிறங்கள்','Colours']],count:['🔢',['எண்ணுதல்','Counting']],abc:['🔤',['ஆங்கில எழுத்து','English letters']],tamil:['அ',['தமிழ் எழுத்து','Tamil letters']],shape:['🔺',['வடிவங்கள்','Shapes']],animal:['🐮',['விலங்கு சத்தம்','Animal sounds']],math:['➕',['கணக்கு','Maths']],pattern:['🧩',['வரிசை','Patterns']],oddone:['🔍',['பொருந்தாதது','Odd one out']],opposite:['↔️',['எதிர்ச்சொல்','Opposites']],memory:['🧠',['நினைவாற்றல்','Memory']],speed:['⚡',['வேகம்','Speed']],logic:['♟️',['யோசனை','Thinking']],creative:['🖍️',['கற்பனை','Creativity']]};

const SHAPES={circle:{en:'Circle',ta:'வட்டம்',s:'<circle cx="50" cy="50" r="42"/>'},square:{en:'Square',ta:'சதுரம்',s:'<rect x="10" y="10" width="80" height="80" rx="4"/>'},triangle:{en:'Triangle',ta:'முக்கோணம்',s:'<polygon points="50,8 94,90 6,90"/>'},star:{en:'Star',ta:'நட்சத்திரம்',s:'<polygon points="50,5 61,38 96,38 68,59 79,93 50,72 21,93 32,59 4,38 39,38"/>'},heart:{en:'Heart',ta:'இதயம்',s:'<path d="M50 88 C10 60 4 34 22 20 C36 10 48 18 50 30 C52 18 64 10 78 20 C96 34 90 60 50 88Z"/>'},rectangle:{en:'Rectangle',ta:'செவ்வகம்',s:'<rect x="4" y="25" width="92" height="50" rx="4"/>'},diamond:{en:'Diamond',ta:'சாய்சதுரம்',s:'<polygon points="50,4 92,50 50,96 8,50"/>'},oval:{en:'Oval',ta:'நீள்வட்டம்',s:'<ellipse cx="50" cy="50" rx="46" ry="30"/>'}};

function numOpts(n,k,min,max){const s=new Set([n]);let g=0;while(s.size<k&&g++<200){const v=n+pick([-3,-2,-1,1,2,3]);if(v>=min&&v<=max)s.add(v)}while(s.size<k)s.add(min+rnd(max-min+1));return shuffle([...s])}

function genQ(cat){

{id:'snakes',e:'🐍',ta:'பாம்பும் ஏணியும்',en:'Snakes & Ladders',c:'#7BD389',min:2,max:4,unit:'📍',skills:['count'],
 how:['பகடையை உருட்டி, அத்தனை கட்டம் நகர்த்து. 🪜 ஏணியில் ஏறு, 🐍 பாம்பில் இறங்கு! ⭐ கட்டத்தில் கேள்விக்குச் சரியாகப் பதில் சொன்னால் +2 கட்டம். முதலில் 🏰 கோட்டையை அடைபவர் வெற்றி.','Roll the dice and move that many squares. Climb 🪜 ladders, slide down 🐍 snakes! Answer the question on a ⭐ square to jump 2 more. First to reach the 🏰 castle wins.'],
 opts:[{k:'qs',l:['⭐ கேள்விக் கட்டங்கள்','⭐ Question squares'],c:[['yes',['ஆம்','Yes']],['no',['இல்லை','No']]],d:'yes'}],
 play(ctx){const P=ctx.players,N=30,LAD={3:12,8:17,15:24,20:28},SNK={14:5,22:11,26:16,29:19},STAR=new Set(ctx.opts.qs==='yes'?[6,10,18,23]:[]);
  const pos={};P.forEach(p=>{pos[p.id]=1;ctx.scores[p.id]=1});let turn=0,busy=false;
  const order=[];for(let r=4;r>=0;r--)for(let c=0;c<6;c++)order.push(r*6+(r%2?6-c:c+1));
  ctx.el.innerHTML=`<div class="sboard" id="sb"></div><p class="note" id="sn" style="margin-top:12px"></p><div class="dicebar"><div class="die" id="die"></div><button class="btn roll" id="roll"></button></div>`;
  const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const die=n=>{$('#die').innerHTML=Array(9).fill(0).map((_,i)=>'<i class="'+(PIPS[n].includes(i)?'on':'')+'"></i>').join('')};
  function draw(){$('#sb').innerHTML=order.map(n=>{const cls=n===N?'end':LAD[n]?'lad':SNK[n]?'snk':STAR.has(n)?'star':(n%2?'a':'b');

    P.forEach(p=>ctx.scores[p.id]=pos[p.id])}

  draw();die(1);upd(L('பகடையை உருட்டு!','Roll the dice!'));speak(P[0].name+', roll the dice!');
  $('#roll').onclick=()=>{if(busy)return;busy=true;$('#roll').disabled=true;$('#die').classList.add('roll');let k=0;
    const anim=()=>{die(1+rnd(6));tone(300+rnd(300),.03,'square',.05);if(++k<10)return ctx.later(anim,70);const d=1+rnd(6);die(d);$('#die').classList.remove('roll');note(d+'! 🎲 '+L('எண்ணிக்கொண்டே நகர்த்து','Count as you move'));speak(String(d));ctx.later(()=>step(d,d,false),600)};anim()};

    if(SNK[n]){note(L('🐍 அச்சச்சோ! பாம்பு! கீழே இறங்கு','🐍 Oh no! A snake! Slide down'));sfx.no();speak('Oh no! A snake!');return ctx.later(()=>{pos[p.id]=SNK[n];draw();endTurn(d)},1000)}
    if(STAR.has(n)&&!bonus){const cat=pick(['color','count','abc','tamil','shape','animal','math','oddone']);
      return ctx.later(()=>askQ(genQ(cat),{who:p,tag:'<span class="tag" style="background:#FFE14D">'+L('⭐ கேள்விக் கட்டம் – சரி என்றால் +2','⭐ Question square – right answer = +2')+'</span>',onResult:ok=>{ctx.record(p.id,cat,ok);bonusOK=ok},onNext:()=>{if(bonusOK){note(L('⭐ சரியான பதில்! +2 கட்டம்','⭐ Correct! +2 squares'));step(2,d,true)}else endTurn(d)}}),500)}
    endTurn(d)}
  let bonusOK=false;
  function endTurn(d){busy=false;const p=P[turn];ctx.record(p.id,'count',true);
    if(d===6){upd(L('6 வந்தது! 🎉 '+p.name+' மீண்டும் உருட்டு!','You got 6! 🎉 '+p.name+', roll again!'));speak('Six! Roll again!');return}

 }},

{id:'ttt',e:'❌',ta:'மூன்று வரிசை',en:'Tic-Tac-Toe',c:'#4D9DE0',min:2,max:2,unit:'🏆',skills:['logic'],

 opts:[{k:'rounds',l:['எத்தனை சுற்று?','How many rounds?'],c:[['3','3'],['5','5'],['7','7']],d:'3'}],
 play(ctx){const P=ctx.players,R=+ctx.opts.rounds,LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let round=0,b,turn,starter=0,over;

  newRound();
 }},

function startGame(g,sel,opts){
  const P=sel.map(pById);
  show(`<div class="top"><button class="btn back" id="qb" aria-label="Stop">←</button><h2>${g.e} ${gn(g)}</h2></div><div class="strip" id="strip"></div><div id="gbody"></div>`,false);

  ctx.every=(f,ms)=>{const t=setInterval(()=>{if(ctx.alive)f()},ms);cleanups.push(()=>clearInterval(t));return t};
  ctx.strip=a=>{$('#strip').innerHTML=P.map(p=>`<div class="sp ${p.id===a?'on':''}" style="--pc:${p.color}"><span>${p.av}</span><b>${esc(p.name)}</b><em>${ctx.scores[p.id]} ${g.unit}</em></div>`).join('')};

  <div class="rank">${sorted.map((p,i)=>`<div class="rrow" style="--pc:${p.color}"><span class="m">${solo?'⭐':scores[p.id]===max?'🥇':i===1?'🥈':'🥉'}</span><span class="a">${p.av}</span><span class="nm">${esc(p.name)}</span><span><span class="s">${scores[p.id]} ${g.unit}</span><br><span class="st">+${gained[p.id]} ⭐</span></span></div>`).join('')}</div>

  const fmt=t=>{const d=new Date(t),n=new Date();return (dkey(d)===dkey(n)?L('இன்று','Today'):d.getDate()+'/'+(d.getMonth()+1))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  show(`<h1 style="font-size:1.9rem">${L('முன்னேற்றம்','Progress')} 📊</h1>
  <h3>${L('தரவரிசை','Leaderboard')} 🏆</h3><div class="lb chunk">${ranked.map((q,i)=>{const t=st(q.id);return `<div class="lbrow" style="--pc:${q.color}"><span class="m">${['🥇','🥈','🥉'][i]||i+1}</span><span class="a">${q.av}</span><span class="nm">${esc(q.name)}</span><span>${t.stars} ⭐ · ${t.wins} 🏆</span></div>`}).join('')}</div>
  <h3>${L('யாருடைய விவரம்?','Whose details?')}</h3><div class="ptabs">${S.players.map(q=>`<button class="pchip ${q.id===progSel?'on':''}" data-p="${q.id}" style="--pc:${q.color}"><span class="a">${q.av}</span>${esc(q.name)}</button>`).join('')}</div>
  <div class="tiles"><div class="tile chunk"><b>${s.stars}</b><small>⭐ ${L('நட்சத்திரம்','Stars')}</small></div><div class="tile chunk"><b>${s.wins}</b><small>🏆 ${L('வெற்றி','Wins')}</small></div><div class="tile chunk"><b>${s.plays}</b><small>🎮 ${L('விளையாட்டு','Games')}</small></div><div class="tile chunk"><b>${streak(s)}</b><small>🔥 ${L('நாள் தொடர்','Day streak')}</small></div></div>
  ${fg?`<p class="soft" style="margin-top:10px;font-weight:700">${L('பிடித்த விளையாட்டு: ','Favourite game: ')}${fg.e} ${gn(fg)} (${fav[1]} ${L('முறை','times')})</p>`:''}
  <h3>${L('திறன்கள்','Skills')} 🌱 <small>(${L('சரியான பதில் %','% right answers')})</small></h3>
  ${sk.length?`<div class="skills chunk">${sk.map(k=>{const [c,t]=s.skills[k],pc=Math.round(c/t*100),col=pc>=80?'var(--good)':pc>=50?'#FFB238':'#FF6B6B';return `<div class="sk"><span class="e">${SKILL[k][0]}</span><span class="l">${tr(SKILL[k][1])} <small>(${c}/${t})</small></span><b>${pc}%</b><div class="bar"><i style="width:${pc}%;background:${col}"></i></div></div>`}).join('')}</div>
  <p class="soft" style="margin-top:8px;font-size:.95rem">${L('🟢 நன்றாகத் தெரியும் · 🟡 வளர்கிறது · 🔴 இன்னும் கொஞ்சம் பயிற்சி','🟢 Knows it well · 🟡 Growing · 🔴 Needs a bit more practice')}</p>`:`<div class="empty chunk">${L('இன்னும் தரவு இல்லை. ஒரு விளையாட்டு விளையாடினால் இங்கே திறன்கள் தெரியும்!','No data yet. Play a game and skills will show up here!')} 🎮</div>`}
  <h3>${L('பதக்கங்கள்','Badges')} 🎖️ <small>(${earned(s).length}/${BADGES.length})</small></h3>
  <div class="badges">${BADGES.map(b=>`<div class="badge chunk ${b.f(s)?'':'off'}"><span class="e">${b.e}</span>${tr(b.n)}</div>`).join('')}</div>
  <h3>${L('சமீபத்திய விளையாட்டுகள்','Recent games')} 🕒</h3>
  ${S.history.length?`<div class="hist chunk">${S.history.slice(0,12).map(h=>{const g=GAMES.find(x=>x.id===h.g)||{e:'🎮',ta:'?',en:'?'},w=h.w&&pById(h.w);return `<div class="hrow"><span class="e">${g.e}</span><div class="d"><b>${gn(g)}</b><small>${fmt(h.t)} · ${h.r.map(([i,sc])=>{const q=pById(i);return (q?q.av:'❔')+' '+sc}).join('  ')}</small></div><span>${w?'🏆'+w.av:h.r.length===1?'⭐':'🤝'}</span></div>`}).join('')}</div>`:`<div class="empty chunk">${L('இன்னும் விளையாட்டு இல்லை. தொடங்கலாமா?','No games yet. Shall we start?')} 🚀</div>`}`,true);
  $$('.ptabs .pchip').forEach(b=>b.onclick=()=>{progSel=b.dataset.p;sfx.tap();progressView()});
}

/* ---------- players ---------- */
function playersView(){
  show(`<h1 style="font-size:1.9rem">${L('வீரர்கள்','Players')} 👨‍👩‍👦</h1><p class="soft" style="margin:4px 0 14px">${L('குடும்பத்தில் எல்லோரையும் சேர்த்துக்கொள்ளலாம் (6 பேர் வரை).','Add everyone in the family (up to 6).')}</p>
  <div class="plist">${S.players.map(p=>{const s=st(p.id);return `<div class="prow chunk" style="--pc:${p.color}"><span class="a">${p.av}</span><div class="d"><b>${esc(p.name)}</b><small>${s.stars} ⭐ · ${s.wins} 🏆 · ${s.plays} 🎮</small></div><button class="btn" data-e="${p.id}" aria-label="Edit">✏️</button><button class="btn" data-d="${p.id}" aria-label="Delete">🗑️</button></div>`}).join('')}</div>
  ${S.players.length<6?'<button class="btn wide primary" id="addp" style="margin-top:16px">+ '+L('புதிய வீரர்','New player')+'</button>':''}`,true);
  $$('[data-e]').forEach(b=>b.onclick=()=>editPlayer(b.dataset.e));
  $$('[data-d]').forEach(b=>b.onclick=()=>{if(S.players.length<=2)return toast(L('குறைந்தது 2 வீரர்கள் வேண்டும்','At least 2 players are needed'));const p=pById(b.dataset.d);
    askConfirm(L(p.av+' '+esc(p.name)+' நீக்கவா?','Remove '+p.av+' '+esc(p.name)+'?'),L('அவருடைய நட்சத்திரங்களும் முன்னேற்றமும் நீக்கப்படும்.','Their stars and progress will be deleted.'),L('நீக்கு','Remove'),()=>{S.players=S.players.filter(x=>x!==p);delete S.stats[p.id];save();playersView()})});
  const a=$('#addp');if(a)a.onclick=()=>editPlayer(null);
}
function editPlayer(id){
  const isNew=!id,p=isNew?{id:'p'+Date.now().toString(36),name:'',av:pick(AVATARS),color:PCOLORS.find(c=>!S.players.some(x=>x.color===c))||pick(PCOLORS)}:Object.assign({},pById(id));
  openModal(`<div class="q">${isNew?L('புதிய வீரர்','New player'):L('வீரரைத் திருத்து','Edit player')}</div><input class="field" id="pn" maxlength="14" placeholder="${L('பெயர்','Name')}" value="${esc(p.name)}" style="margin-top:10px">
  <div class="avgrid">${AVATARS.map(a=>`<button class="avb ${a===p.av?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>
  <div class="colgrid">${PCOLORS.map(c=>`<button class="cbtn ${c===p.color?'on':''}" data-c="${c}" style="background:${c}" aria-label="colour"></button>`).join('')}</div>
  <div class="row2"><button class="btn" id="pc">${L('ரத்து','Cancel')}</button><button class="btn primary" id="ps">${L('சேமி','Save')} ✅</button></div>`);
  $$('.avb').forEach(b=>b.onclick=()=>{p.av=b.dataset.a;$$('.avb').forEach(x=>x.classList.toggle('on',x===b));sfx.tap()});
  $$('#modal .cbtn').forEach(b=>b.onclick=()=>{p.color=b.dataset.c;$$('#modal .cbtn').forEach(x=>x.classList.toggle('on',x===b));sfx.tap()});
  $('#pc').onclick=closeModal;
  $('#ps').onclick=()=>{p.name=$('#pn').value.trim();if(!p.name){toast(L('பெயரை எழுதுங்கள்','Please type a name'));return}
    if(isNew)S.players.push(p);else Object.assign(pById(id),p);save();closeModal();sfx.yes();playersView()};
}

/* ---------- settings ---------- */
function prefsView(){
  const seg=(k,choices)=>`<div class="seg" data-k="${k}">${choices.map(c=>`<button class="btn ${String(S.settings[k])===String(c[0])?'on':''}" data-v="${c[0]}">${tr(c[1])}</button>`).join('')}</div>`;
  show(`<h1 style="font-size:1.9rem">${L('அமைப்பு','Settings')} ⚙️</h1>
  <div class="set chunk" style="margin-top:14px">
   <div class="optrow"><label>🌐 ${L('மொழி','Language')}</label>${seg('lang',[['ta','தமிழ்'],['en','English']])}</div>
   <div class="optrow"><label>🔔 ${L('ஒலி விளைவுகள்','Sound effects')}</label>${seg('sound',[[true,['ஆன்','On']],[false,['ஆஃப்','Off']]])}</div>
   <div class="optrow"><label>🗣️ ${L('கேள்விகளைச் சத்தமாக வாசி','Read questions aloud')}</label>${seg('voice',[[true,['ஆன்','On']],[false,['ஆஃப்','Off']]])}</div>
   <div class="optrow"><label>🎯 ${L('கடினம்','Difficulty')}</label>${seg('diff',[['easy',['எளிது (UKG)','Easy (UKG)']],['med',['நடுத்தரம் (1st Std)','Medium (1st Std)']]])}</div>
   <div class="optrow"><label>🌗 ${L('தோற்றம்','Theme')}</label>${seg('theme',[['auto',['தானியங்கி','Auto']],['light',['☀️ பகல்','☀️ Light']],['dark',['🌙 இரவு','🌙 Dark']]])}</div>
  </div>
  <h3>${L('பெற்றோருக்கு','For parents')} 💡</h3>
  <div class="set chunk"><p>${L('முன்னேற்றம் தானாகச் சேமிக்கப்படும். “முன்னேற்றம்” பக்கத்தில் எந்தத் திறனில் உங்கள் குழந்தை வலுவாக இருக்கிறான், எதில் பயிற்சி தேவை என்று பார்க்கலாம்.','Progress is saved automatically. On the Progress page you can see which skills your child is strong in and which need more practice.')}</p><p class="soft">${L('“யார் முதலில்?” விளையாட்டில் “உதவி” முறையை இயக்கினால் பெரியவருக்குச் சிறு தாமதம் கிடைக்கும், போட்டி சமமாக இருக்கும்.','In “Tap Race”, turn on Helper mode to give the adult a small delay so the race stays fair.')}</p></div>
  <button class="btn wide danger" id="reset" style="margin-top:18px">🗑️ ${L('எல்லா முன்னேற்றத்தையும் அழி','Clear all progress')}</button>`,true);
  $$('.seg').forEach(sg=>$$('button',sg).forEach(b=>b.onclick=()=>{const k=sg.dataset.k;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;S.settings[k]=v;save();applyTheme();sfx.tap();go('prefs')}));
  $('#reset').onclick=()=>askConfirm(L('எல்லாவற்றையும் அழிக்கவா?','Clear everything?'),L('நட்சத்திரங்கள், பதக்கங்கள், வரலாறு எல்லாம் நீக்கப்படும். வீரர்கள் அப்படியே இருப்பார்கள்.','Stars, badges and history will be deleted. Players will stay.'),L('அழி','Clear'),()=>{S.stats={};S.history=[];save();toast(L('அழிக்கப்பட்டது','Cleared'));go('prefs')});
}

go('home');
</script>
</body>
</html>
